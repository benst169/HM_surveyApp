# Custom deploy workflow (replaces the posit-dev/r-shinylive reusable
# workflow) so we can pass template_params to shinylive::export() - this
# bakes the manifest link and a mobile-viewport-height fix directly into
# the initial index.html, rather than relying on our Shiny UI to inject
# them after R finishes booting inside WebAssembly (which was too late for
# the browser's PWA-installability check to see them).
name: Deploy app to gh-pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::shinyMobile
            any::shinylive
            any::jsonlite

      - name: Export shinylive app
        shell: Rscript {0}
        run: |
          # The manifest is embedded directly as a data: URI in the <link>
          # tag rather than linked as an external file. Chrome's manifest
          # fetch mechanism uses a request pattern that shinylive's own
          # service worker doesn't handle correctly (fails with "'only-if-
          # cached' can be set only with 'same-origin' mode"), causing the
          # manifest to silently 404 even though the file exists. A data:
          # URI resolves immediately with no network request at all, so
          # there's nothing for that service worker to intercept.
          # Icons are embedded the same way (base64 data: URIs) rather than
          # linked as external files - Chrome's manifest processing failed
          # to load them too even though they're directly reachable by
          # normal navigation, matching the same service-worker interaction
          # problem as the manifest file itself.
          icon_192_uri <- paste0(
            "data:image/png;base64,",
            gsub("[\r\n]", "", jsonlite::base64_enc(readBin("icons/icon-192.png", "raw", file.info("icons/icon-192.png")$size)))
          )
          icon_512_uri <- paste0(
            "data:image/png;base64,",
            gsub("[\r\n]", "", jsonlite::base64_enc(readBin("icons/icon-512.png", "raw", file.info("icons/icon-512.png")$size)))
          )

          manifest_json <- paste0(
            '{"name":"Hau Moana | Aerial Survey Data Collection",',
            '"short_name":"Hau Moana",',
            '"start_url":"https://benst169.github.io/HM_surveyApp/",',
            '"display":"standalone",',
            '"orientation":"any",',
            '"background_color":"#ffffff",',
            '"theme_color":"#2196f3",',
            '"icons":[',
            '{"src":"', icon_192_uri, '","sizes":"192x192","type":"image/png"},',
            '{"src":"', icon_512_uri, '","sizes":"512x512","type":"image/png"}',
            ']}'
          )
          manifest_data_uri <- paste0(
            "data:application/manifest+json;base64,",
            gsub("[\r\n]", "", jsonlite::base64_enc(charToRaw(manifest_json)))
          )

          # Cache-busting suffix based on the commit SHA - ensures GitHub's
          # CDN (Fastly) always treats this as a new URL on each deploy,
          # rather than potentially serving a stale cached response (this
          # includes cached 404s, which don't clear just by clearing your
          # own browser's cache/incognito - that only affects your browser,
          # not the CDN layer in between).
          cache_bust <- Sys.getenv("GITHUB_SHA", unset = as.character(Sys.time()))

          shinylive::export(
            appdir = ".",
            destdir = "site",
            template_params = list(
              include_in_head = paste(
                paste0('<link rel="manifest" href="', manifest_data_uri, '">'),
                '<meta name="theme-color" content="#2196f3">',
                '<link rel="icon" href="icons/favicon.png">',
                paste0('<script src="indexeddb-storage.js?v=', cache_bust, '"></script>'),
                '<script>',
                'function hmSetVh() {',
                '  document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");',
                '}',
                'hmSetVh();',
                'window.addEventListener("resize", hmSetVh);',
                'window.addEventListener("orientationchange", hmSetVh);',
                '</script>',
                '<style>',
                'html, body, .framework7-root, .view, .view-main {',
                '  height: 100vh;',
                '  height: calc(var(--vh, 1vh) * 100);',
                '  height: 100dvh;',
                '}',
                '.toolbar, .tabbar {',
                '  position: fixed !important;',
                '  bottom: 0 !important;',
                '}',
                '</style>',
                sep = "\n"
              )
            )
          )

          dir.create(file.path("site", "icons"), recursive = TRUE, showWarnings = FALSE)
          file.copy(
            list.files("icons", full.names = TRUE),
            file.path("site", "icons"),
            overwrite = TRUE
          )
          file.copy(
            "indexeddb-storage.js",
            file.path("site", "indexeddb-storage.js"),
            overwrite = TRUE
          )

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
