# Custom deploy workflow (replaces the posit-dev/r-shinylive reusable
# workflow) so we can pass template_params to shinylive::export() - this
# bakes the manifest link and a mobile-viewport-height fix directly into
# the initial index.html, rather than relying on our Shiny UI to inject
# them after R finishes booting inside WebAssembly (which was too late for
# the browser's PWA-installability check to see them).
name: Deploy app to gh-pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::shinyMobile
            any::shinylive

      - name: Export shinylive app
        shell: Rscript {0}
        run: |
          shinylive::export(
            appdir = ".",
            destdir = "site",
            template_params = list(
              include_in_head = paste(
                '<link rel="manifest" href="manifest.webmanifest">',
                '<meta name="theme-color" content="#2196f3">',
                '<link rel="icon" href="icons/favicon.png">',
                '<script src="indexeddb-storage.js"></script>',
                '<script>',
                'function hmSetVh() {',
                '  document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");',
                '}',
                'hmSetVh();',
                'window.addEventListener("resize", hmSetVh);',
                'window.addEventListener("orientationchange", hmSetVh);',
                '</script>',
                '<style>',
                'html, body, .framework7-root, .view, .view-main {',
                '  height: 100vh;',
                '  height: calc(var(--vh, 1vh) * 100);',
                '  height: 100dvh;',
                '}',
                '.toolbar, .tabbar {',
                '  position: fixed !important;',
                '  bottom: 0 !important;',
                '}',
                '</style>',
                sep = "\n"
              )
            )
          )

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
